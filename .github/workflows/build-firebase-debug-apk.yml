name: Build Firebase-connected debug APK

# This is the workflow that actually gets a new build in front of testers -
# CI (ci.yml) only ever produces an ephemeral compile-check artifact, never
# an App Distribution upload. Before this, that meant every commit to the
# app needed someone to remember to come here and click "Run workflow" by
# hand, which is exactly the kind of manual step that silently stops
# happening: a real gap where testers were left on a build from hours/days
# earlier while unaware new commits had landed. Push-triggering on the
# paths that can actually change what gets built closes that gap; the
# concurrency group keeps a burst of pushes from queuing redundant uploads
# for commits that are about to be superseded anyway.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-firebase-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Assemble debug APK with real Firebase config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Firebase config secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: test -n "$GOOGLE_SERVICES_JSON_BASE64"
      - name: Materialize app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode --ignore-garbage > app/google-services.json
          python3 -c "import json,sys; json.load(open('app/google-services.json'))"
      # A monotonically-increasing versionCode is what lets the self-update
      # system (VersionChecker) detect "is there a newer build" at all - a
      # commit count is a simple, always-increasing source for it since this
      # workflow runs on every push. fetch-depth: 0 above is required for
      # rev-list --count to see full history instead of a 1-commit shallow clone.
      - name: Compute version metadata
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug \
            -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" -PGIT_COMMIT="$GIT_COMMIT"
      # Absolute path - the self-update publish step below runs with a
      # different working-directory (firebase/functions), and a
      # repo-root-relative path silently resolves to the wrong file there
      # (a real bug this comment now documents: it threw ENOENT until fixed).
      - name: Compute APK checksum
        run: |
          APK_PATH="$(readlink -f "$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)")"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_CHECKSUM=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: nirog-bhumi-firebase-debug-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
      # WIF auth moved ahead of both downstream steps that need it: App
      # Distribution now authenticates via the same short-lived WIF
      # credentials as the self-update publish step, instead of the old
      # FIREBASE_TOKEN secret (a `firebase login:ci` personal OAuth token
      # that silently expires - confirmed dead in production: "Your
      # credentials are no longer valid", which is why testers stopped
      # getting new-build emails). WIF never expires the same way, so this
      # removes that whole class of failure rather than just rotating it
      # once. Best-effort: a missing/misconfigured WIF secret must not turn
      # a good compile into a red build - the "Build debug APK" step above
      # is the real compile gate.
      - uses: google-github-actions/auth@v3
        id: auth
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Distribute to Firebase App Distribution testers
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        env:
          APP_DISTRIBUTION_TESTERS: ${{ secrets.APP_DISTRIBUTION_TESTERS }}
        run: |
          if [ -z "$APP_DISTRIBUTION_TESTERS" ]; then
            echo "APP_DISTRIBUTION_TESTERS secret not set - skipping App Distribution upload."
            exit 0
          fi
          # No FIREBASE_TOKEN env var set here - firebase-tools falls back to
          # GOOGLE_APPLICATION_CREDENTIALS (exported by the auth step above)
          # automatically once FIREBASE_TOKEN is absent.
          if npx --yes firebase-tools@15.22.3 appdistribution:distribute "$APK_PATH" \
            --app 1:126409331898:android:b4e478566dcbeeb7009e83 \
            --project nirog-bhumi-app \
            --testers "$APP_DISTRIBUTION_TESTERS" \
            --release-notes "Automated debug build - commit ${{ github.sha }}"; then
            echo "Distributed to testers."
          else
            echo "::warning::App Distribution upload failed. The APK built fine and is attached as a workflow artifact."
          fi
      # Publishing self-update metadata is also best-effort, same reasoning as
      # App Distribution above. This is what lets the app itself detect
      # "there's a newer version" (see docs/self-update-system.md) - every
      # push to main/claude/** here becomes visible on the "development"
      # update channel within seconds of this job finishing.
      - uses: actions/setup-node@v6
        if: steps.auth.outcome == 'success'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Publish self-update release metadata
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        working-directory: firebase/functions
        env:
          FIREBASE_PROJECT_ID: nirog-bhumi-app
          FIREBASE_STORAGE_BUCKET: nirog-bhumi-app.firebasestorage.app
          RELEASE_CHANNEL: development
          RELEASE_NOTES: "Automated debug build - commit ${{ github.sha }}"
        run: |
          npm ci
          node scripts/publish-release.mjs
