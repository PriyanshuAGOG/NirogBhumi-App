name: Seed demo Care+ program

# Manual-only, never auto-triggered on push - seeding test data is a
# deliberate action, not something that should run on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Seed demo program
        working-directory: firebase/functions
        env:
          FIREBASE_PROJECT_ID: nirog-bhumi-app
        run: |
          npm ci
          node scripts/seed-demo-program.mjs
