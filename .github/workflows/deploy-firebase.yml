name: Deploy Firebase

on:
  # Backend changes (functions/rules/indexes) sat undeployed for days at a
  # time when this was workflow_dispatch-only - every commit needed someone
  # to remember to come here and click "Run workflow" by hand, which is
  # exactly the kind of manual step that silently stops happening. This is
  # the same gap (and same fix) as build-firebase-debug-apk.yml's push
  # trigger: deploy automatically the moment backend code actually changes.
  push:
    branches: [main, 'claude/**']
    paths:
      - 'firebase/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase project ID
        required: true
        type: string
        default: nirog-bhumi-app

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      # Workload Identity Federation: GitHub's OIDC token is exchanged for a
      # short-lived GCP access token at run time - no service-account key is
      # ever created or stored, so this works even where the org policy
      # blocking key creation (see docs/deploy-wif-setup.md) blocks the
      # credentials_json approach entirely.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Build functions
        working-directory: firebase/functions
        run: npm ci && npm test
      - name: Build console
        working-directory: console
        # Firebase web config isn't a secret - it's shipped in the client
        # bundle either way, security comes from Firestore/Storage rules and
        # App Check, not from hiding these values (see console/.env.example).
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAYFiVyhjpaIDBFFU82FPv__GWxObXnIks
          VITE_FIREBASE_AUTH_DOMAIN: nirog-bhumi-app.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: nirog-bhumi-app
          VITE_FIREBASE_STORAGE_BUCKET: nirog-bhumi-app.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "126409331898"
          VITE_FIREBASE_APP_ID: "1:126409331898:web:62ba9137dd9781f0009e83"
        run: npm ci && npm run build
      # Split into two deploys on purpose:
      #  1. firestore/storage/hosting WITHOUT --force. --force on a Firestore
      #     deploy would DELETE any composite index present in the project but
      #     missing from firestore.indexes.json - which could silently drop a
      #     manually-created index the app depends on. Never force-delete
      #     indexes; a missing one is added to the file, not pruned live.
      #  2. functions WITH --force, so it can prune functions removed from
      #     source (e.g. the long-renamed onAnnouncementCreate) instead of
      #     aborting in non-interactive mode.
      # NOTE: the functions step can still fail if the project's
      # `iam.allowedPolicyMemberDomains` org policy blocks binding the public
      # (allUsers) invoker on a *newly created* callable function - that's an
      # owner/infra action (lift/except the org policy, or grant the deploy SA
      # roles/run.admin), not a code issue. Rules + indexes in step 1 still
      # deploy cleanly regardless.
      - name: Deploy Firestore rules, indexes, Storage rules, and Hosting
        env:
          PROJECT_ID: ${{ inputs.project_id || 'nirog-bhumi-app' }}
        run: npx --yes firebase-tools@latest deploy --project "$PROJECT_ID" --only firestore,storage,hosting --non-interactive
      - name: Deploy Cloud Functions
        env:
          PROJECT_ID: ${{ inputs.project_id || 'nirog-bhumi-app' }}
        run: npx --yes firebase-tools@latest deploy --project "$PROJECT_ID" --only functions --non-interactive --force
