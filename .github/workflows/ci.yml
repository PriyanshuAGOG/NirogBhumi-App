name: CI

# All work on this repo happens directly on claude/** branches, not via PRs
# into main - so a push-trigger scoped to [main] only never actually fires
# in practice, and every run up to this point had to be started by hand
# via workflow_dispatch. Adding claude/** here is what makes CI actually
# automatic for the branch this repo really uses.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile, test, lint, and package debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle.log
      # A short digest of what broke, printed last so it is the first thing seen in the log.
      - name: Summarise compile and test failures
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|error:|Execution failed" -A2 gradle.log | head -150 || true
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-and-reports
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            gradle.log

  # A separate, short job that prints only what broke in the Android build. Its log is tiny, so the
  # cause is visible without scrolling through Gradle cache summaries.
  android-failure-digest:
    name: Android failure digest
    needs: [android]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-debug-and-reports
          path: digest
      - name: Print compile errors and failed tests
        run: |
          log=$(find digest -name gradle.log | head -1)
          echo "== compile errors =="; grep -E "^e: " "$log" | sed 's#file:///home/runner/work/NirogBhumi-App/NirogBhumi-App/##' | head -80 || true
          echo "== failed tests / tasks =="; grep -E "FAILED|What went wrong" -A3 "$log" | head -80 || true

  android-release:
    name: Android release build (R8/minify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      # The signed AAB that actually ships is only ever built inside
      # upload-google-play.yml, which needs the owner's Play + keystore
      # secrets - so before this job existed, nothing ever exercised the
      # RELEASE build (R8 code-shrinking, resource shrinking, ProGuard
      # rules) on a push. A missing keep rule or an R8-stripped class would
      # surface only at upload time, or as a crash on a user's device.
      # The google-services plugin is conditional (no google-services.json in
      # CI), and signing uses a throwaway key (see the step below), which is
      # enough to prove the shipping artifact compiles, minifies and signs on
      # every push.
      # Unit tests live in the shared src/test source set (no release-specific
      # test source set), so the debug job's testDebugUnitTest already covers
      # them - this job's job is purely to exercise the release artifact:
      # R8 code-shrinking, resource shrinking, and ProGuard.
      # Signs with a throwaway keystore created on the runner so the exact
      # signing path used for the real upload (KEYSTORE_PATH/STORE_PASSWORD/
      # KEY_ALIAS/KEY_PASSWORD env -> signingConfigs.release) is exercised on
      # every push. The key is discarded with the runner and is NOT the upload
      # key; the resulting bundle is never published.
      - name: Build signed release bundle with a throwaway key (verify R8 + resource shrinking + signing)
        env:
          STORE_PASSWORD: ci-throwaway-pass
          KEY_ALIAS: ci-throwaway
          KEY_PASSWORD: ci-throwaway-pass
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/ci-throwaway.jks"
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI throwaway"
          ./gradlew --no-daemon --max-workers=2 bundleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.0.${{ github.run_number }}-ci
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -n1)"
          jarsigner -verify "$AAB" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt
          # It must be signed by the throwaway key, not left unsigned or debug-signed.
          jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=CI throwaway"
      # Guard the merged manifest that actually ships: no debuggable flag,
      # cleartext traffic, backups, advertising ID, install-packages or any
      # permission we haven't declared in the Data Safety form.
      - name: Verify merged release manifest (permissions, exported components)
        run: python3 scripts/verify_release_manifest.py
      - name: Upload release bundle and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-ci-signed-and-reports
          if-no-files-found: ignore
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/**

  release-gates:
    name: Release gates (store listing, notes, graphics)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Non-strict: legal placeholders are allowed here (they are only blocked
      # for closed/production uploads in upload-google-play.yml), but a
      # store description over Play's limit or a missing graphic is not.
      - name: Check store listing limits, release notes and graphics
        run: python3 scripts/check_release_gates.py
      # One official contact address everywhere (support, privacy, deletion, Grievance Officer).
      - name: Check that only the official contact email is used
        run: python3 scripts/check_contact_email.py

  functions:
    name: Firebase Functions type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test
      # Behavioural tests of the callables/triggers (access-code redemption,
      # coach inbox push, ...) against the Firestore emulator - the type-check
      # above proves it compiles, not that enrollment logic is correct.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Cloud Functions unit tests against the emulator
        working-directory: .
        run: npx --yes firebase-tools@15.22.3 emulators:exec --only firestore,auth --project demo-nirog-bhumi "npm --prefix firebase/functions run test:unit"

  firebase-rules:
    name: Firebase rules validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json
      - name: Install rules test dependencies
        working-directory: firebase/rules-tests
        run: npm ci
      # Runs the actual security-rules unit test suite (firebase/rules-tests)
      # against a real emulator, not just a syntax check - this is what
      # verifies access-control *logic* (per-coach batch scoping, the
      # field-restricted self-update rules, the program-enrollment lock),
      # none of which a "does it compile" check would ever catch.
      - name: Run rules unit tests against the emulator
        run: npx --yes firebase-tools@15.22.3 emulators:exec --only firestore,storage --project demo-nirog-bhumi "npm --prefix firebase/rules-tests test"

  console-e2e:
    name: Console end-to-end (browser + emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Drives the real console bundle in Chromium against the Auth + Firestore +
      # Functions emulators as an admin and as a coach (access codes, announcements,
      # data requests, coach scoping, batch messaging). Unit and rules tests can't
      # catch a page that queries the wrong way or a button wired to nothing.
      - name: Install e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Run console end-to-end tests
        run: bash e2e/run.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-e2e-screenshots
          if-no-files-found: ignore
          path: e2e/artifacts/*.png
