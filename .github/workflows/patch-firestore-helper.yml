name: One-time Firestore helper hardening

on:
  push:
    branches: [chatgpt/security-qa-hardening-2026-09-17]
    paths:
      - '.github/workflows/patch-firestore-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/security-qa-hardening-2026-09-17
      - name: Make assignedCoachToUser fail cleanly for missing users
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firebase/firestore.rules')
          text = p.read_text()
          old = '''    function assignedCoachToUser(uid) {
      let userDoc = get(/databases/$(database)/documents/users/$(uid));
      return coach() && uid is string && uid != ''
        && userDoc.data.programActive == true
        && assignedCoach(userDoc.data.activeProgramId);
    }'''
          new = '''    function assignedCoachToUser(uid) {
      return coach() && uid is string && uid != ''
        && exists(/databases/$(database)/documents/users/$(uid))
        && get(/databases/$(database)/documents/users/$(uid)).data.programActive == true
        && assignedCoach(get(/databases/$(database)/documents/users/$(uid)).data.activeProgramId);
    }'''
          if old not in text:
              raise SystemExit('Expected assignedCoachToUser helper not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardened helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/firestore.rules
          git commit -m "security: fail closed for missing coach member profiles"
          git push origin HEAD:chatgpt/security-qa-hardening-2026-09-17
